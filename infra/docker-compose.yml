version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitg
      POSTGRES_USER: aitg
      POSTGRES_PASSWORD: aitg_local_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitg -d aitg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
