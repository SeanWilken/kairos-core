name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install repo tooling
        run: bun install

      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e "./backend[dev]"

      - name: Run backend checks
        run: bun run check:backend

      - name: Test workspace and migration helpers
        run: bun test scripts/workspace-helper.test.mjs scripts/migration-helper.test.mjs

      - name: Smoke-test workspace wrapper
        run: bash scripts/multi-repo-workflow.sh --action list --json

      - name: Enforce changelog update on PRs
        if: github.event_name == 'pull_request'
        run: node scripts/check-changelog-ci.mjs

      - name: Verify OpenAPI snapshot
        run: |
          backend/.venv/bin/python backend/scripts/export_openapi.py
          git diff --exit-code shared-contracts/openapi/v1/openapi.json
